name: Actualizar Estadísticas Gordo

on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar update_stats.py
        env:
          LOTERIA_API_KEY: ${{ secrets.LOTERIA_API_KEY }}
        run: python update_stats.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estadisticas_gordo.json gordo_historico.csv
          git diff --staged --quiet || git commit -m "stats: actualización automática $(date +'%d/%m/%Y')"
          git push
